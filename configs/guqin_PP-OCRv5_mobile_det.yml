Global:
  model_name: PP-OCRv5_mobile_det
  debug: false
  use_gpu: false
  epoch_num: &epoch_num 50
  log_smooth_window: 10
  print_batch_step: 5
  save_model_dir: ../../05_訓練資料/模型輸出/guqin_mobile_det_panels
  save_epoch_step: 10
  eval_batch_step: [0, 20]
  cal_metric_during_train: false
  checkpoints:
  pretrained_model: https://paddle-model-ecology.bj.bcebos.com/paddlex/official_pretrained_model/PP-OCRv5_mobile_det_pretrained.pdparams
  save_inference_dir: ../../05_訓練資料/模型輸出/guqin_mobile_det_panels/inference
  use_visualdl: false
  distributed: false
  d2s_train_image_shape: [3, 640, 640]

Architecture:
  model_type: det
  algorithm: DB
  Transform: null
  Backbone: {name: PPLCNetV3, scale: 0.75, det: true}
  Neck: {name: RSEFPN, out_channels: 96, shortcut: true}
  Head: {name: DBHead, k: 50, fix_nan: true}

Loss:
  name: DBLoss
  balance_loss: true
  main_loss_type: DiceLoss
  alpha: 5
  beta: 10
  ohem_ratio: 3

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr: {name: Cosine, learning_rate: 0.0001, warmup_epoch: 1}
  regularizer: {name: L2, factor: 0.00005}

PostProcess:
  name: DBPostProcess
  thresh: 0.2
  box_thresh: 0.3
  max_candidates: 1500
  unclip_ratio: 1.15

Metric: {name: DetMetric, main_indicator: hmean}

Train:
  dataset:
    name: SimpleDataSet
    data_dir: ../../05_訓練資料/paddleocr_detection_panels
    label_file_list: [../../05_訓練資料/paddleocr_detection_panels/train.txt]
    ratio_list: [1.0]
    transforms:
      - DecodeImage: {img_mode: BGR, channel_first: false}
      - DetLabelEncode: null
      - IaaAugment:
          augmenter_args:
            - {type: Affine, args: {rotate: [-2, 2]}}
            - {type: Resize, args: {size: [0.8, 1.5]}}
      - EastRandomCropData: {size: [640, 640], max_tries: 50, keep_ratio: true}
      - MakeBorderMap: {shrink_ratio: 0.4, thresh_min: 0.3, thresh_max: 0.7, total_epoch: *epoch_num}
      - MakeShrinkMap: {shrink_ratio: 0.4, min_text_size: 5, total_epoch: *epoch_num}
      - NormalizeImage: {scale: 1./255., mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225], order: hwc}
      - ToCHWImage: null
      - KeepKeys: {keep_keys: [image, threshold_map, threshold_mask, shrink_map, shrink_mask]}
  loader: {shuffle: true, drop_last: false, batch_size_per_card: 2, num_workers: 0}

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ../../05_訓練資料/paddleocr_detection_panels
    label_file_list: [../../05_訓練資料/paddleocr_detection_panels/val.txt]
    transforms:
      - DecodeImage: {img_mode: BGR, channel_first: false}
      - DetLabelEncode: null
      - DetResizeForTest: {limit_side_len: 1280, limit_type: max}
      - NormalizeImage: {scale: 1./255., mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225], order: hwc}
      - ToCHWImage: null
      - KeepKeys: {keep_keys: [image, shape, polys, ignore_tags]}
  loader: {shuffle: false, drop_last: false, batch_size_per_card: 1, num_workers: 0}

profiler_options: null
